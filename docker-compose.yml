services:
  web:
    image: nginx:alpine
    container_name: inteteam-web
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-tier
    # Size-capped rolling logs (Docker keeps them forever by default).
    # The Privacy Policy says website logs are overwritten automatically.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy-tier:
    external: true
